<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>POLRI Transcriber Interface</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 2rem;
        }
        
        textarea {
            width: 100%;
            height: 150px;
            margin-top: 1rem;
        }
        
        button {
            margin-top: 1rem;
            padding: 0.5rem 1rem;
        }
    </style>
</head>

<body>
    <h1>🎙️ POLRI Audio Transcription</h1>

    <form id="uploadForm">
        <label for="audioFile">Upload Audio (.wav):</label><br>
        <input type="file" id="audioFile" name="file" accept=".wav" required><br>
        <button type="submit">Transcribe</button>
    </form>

    <h2>🧾 Aligned Transcript</h2>
    <textarea id="alignedOutput" placeholder="Transcription will appear here..."></textarea>

    <button onclick="polish()">✨ Polish Transcript</button>

    <h2>📜 Polished Transcript</h2>
    <textarea id="polishedOutput" placeholder="Polished output will appear here..."></textarea>

    <button onclick="generateBerita()">📄 Generate Berita Acara</button>

    <h2>⚖️ Prediksi Pasal Hukum</h2>
    <textarea id="pasalOutput" placeholder="Hasil ekstraksi pasal akan muncul di sini..." style="height: 200px;"></textarea>
    <br>
    <button onclick="extractPasal()">⚖️ Ekstrak Pasal Hukum</button>

    <h2>🧾 Berita Acara Markdown</h2>
    <textarea id="beritaOutput" placeholder="Berita Acara will appear here..."></textarea>
    <button onclick="downloadMarkdown()">⬇️ Download Markdown</button>
    <button onclick="downloadPDF()">⬇️ Download PDF</button>

    <h2>📦 Download ZIP</h2>
    <button onclick="runFullProcess()">Run Full Pipeline 🔁</button>
    <div id="progress"></div>



    <script>
        const MODEL_NAME = "qwen/qwen3-235b-a22b";
        let latestMdFile = "";
        let latestPdfFile = "";
        let alignedSegments = [];

        document.getElementById("uploadForm").addEventListener("submit", async function(e) {
            e.preventDefault();
            const formData = new FormData();
            formData.append("file", document.getElementById("audioFile").files[0]);

            const res = await fetch("/transcribe", {
                method: "POST",
                body: formData
            });
            const data = await res.json();
            alignedSegments = data.aligned_segments;
            document.getElementById("alignedOutput").value = JSON.stringify(alignedSegments, null, 2);
        });


        async function polish() {
            const aligned = JSON.parse(document.getElementById("alignedOutput").value);

            const res = await fetch("/polish", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    model_name: MODEL_NAME,
                    aligned_segments: aligned
                })
            });

            const result = await res.json();
            document.getElementById("polishedOutput").value = JSON.stringify(result.polished, null, 2);
        }

        async function generateBerita() {
            let raw = document.getElementById("polishedOutput").value.trim();
            let parsed = typeof raw === "string" ? JSON.parse(raw) : raw;
            let polishedJSON = typeof parsed === "string" ? JSON.parse(parsed) : parsed;

            const res = await fetch("/generate-berita-acara", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    model_name: MODEL_NAME,
                    aligned_segments: polishedJSON
                })
            });

            const result = await res.json();
            const markdownContent = result.berita_acara;
            document.getElementById("beritaOutput").value = markdownContent;

            // ⬇️ Automatically save the files now
            const saveRes = await fetch("/save-berita", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    model_name: MODEL_NAME,
                    aligned_segments: polishedJSON
                })
            });

            const files = await saveRes.json();
            latestMdFile = files.markdown_file;
            latestPdfFile = files.pdf_file;
            alert("✅ Berita Acara berhasil disimpan. Silakan unduh Markdown atau PDF.");
        }

        async function downloadBerita() {
            const polishedJSON = JSON.parse(document.getElementById("polishedOutput").value);

            const res = await fetch("/save-berita", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    model_name: MODEL_NAME,
                    aligned_segments: polishedJSON
                })
            });

            const files = await res.json();
            latestMdFile = files.markdown_file;
            latestPdfFile = files.pdf_file;

            alert("✅ Berita Acara berhasil disimpan. Silakan klik tombol download Markdown/PDF.");
        }

        function downloadMarkdown() {
            if (!latestMdFile) return alert("❌ Belum ada file Markdown. Klik 'Generate' dulu.");
            window.open("/download?file=" + encodeURIComponent(latestMdFile), "_blank");
        }

        function downloadPDF() {
            if (!latestPdfFile) return alert("❌ Belum ada file PDF. Klik 'Generate' dulu.");
            window.open("/download?file=" + encodeURIComponent(latestPdfFile), "_blank");
        }

        async function runFullPipeline() {
            const formData = new FormData();
            formData.append("file", document.getElementById("audioFile").files[0]);

            const res = await fetch("/full-process", {
                method: "POST",
                body: formData
            });

            const blob = await res.blob();
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "full_pipeline_output.zip";
            document.body.appendChild(a);
            a.click();
            a.remove();
        }

        async function runFullProcess() {
            const file = document.getElementById("audioFile").files[0];
            const formData = new FormData();
            formData.append("file", file);

            const startRes = await fetch("/full-process-async", {
                method: "POST",
                body: formData
            });
            const {
                task_id
            } = await startRes.json();
            document.getElementById("progress").innerText = "⏳ Starting pipeline...";

            const interval = setInterval(async() => {
                const res = await fetch(`/status/${task_id}`);
                const {
                    status
                } = await res.json();
                document.getElementById("progress").innerText = status;

                if (status.startsWith("✅")) {
                    clearInterval(interval);
                    const downloadLink = status.split(": ")[1];
                    const a = document.createElement("a");
                    a.href = downloadLink;
                    a.innerText = "⬇️ Download ZIP";
                    a.download = downloadLink.split("file=")[1];
                    document.getElementById("progress").appendChild(document.createElement("br"));
                    document.getElementById("progress").appendChild(a);
                }

                if (status.startsWith("❌")) {
                    clearInterval(interval);
                }
            }, 2000);
        }


        async function extractPasal() {
            const raw = document.getElementById("polishedOutput").value.trim();
            const parsed = typeof raw === "string" ? JSON.parse(raw) : raw;

            const res = await fetch("/extract-pasal", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    model_name: MODEL_NAME,
                    aligned_segments: parsed
                })
            });

            const result = await res.json();
            document.getElementById("pasalOutput").value = result.pasal_hukum;
            if (result.markdown_file) {
                const downloadBtn = document.createElement("button");
                downloadBtn.innerText = "⬇️ Download Pasal Markdown";
                downloadBtn.onclick = () => {
                    window.open("/download?file=" + encodeURIComponent(result.markdown_file), "_blank");
                };

                // Only add if not already added
                const pasalSection = document.getElementById("pasalOutput").parentNode;
                if (!document.getElementById("pasalDownloadBtn")) {
                    downloadBtn.id = "pasalDownloadBtn";
                    pasalSection.appendChild(document.createElement("br"));
                    pasalSection.appendChild(downloadBtn);
                }
            }
        }
    </script>
</body>

</html>
